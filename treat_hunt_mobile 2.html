<head>

<title>Treat Hunt</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b9d89e;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;touch-action:none}
#game{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:5}
.pill{background:#fffffff0;color:#394731;padding:9px 13px;border-radius:20px;font-weight:800;box-shadow:0 3px 12px #0002}
#start,#finish{position:fixed;inset:0;background:#0003;display:flex;align-items:center;justify-content:center;z-index:10}
.card{width:min(82vw,390px);background:#fffaf0;border-radius:26px;padding:27px;text-align:center;box-shadow:0 15px 50px #0004}
h1{margin:0 0 8px;color:#34442d;font-size:32px}
p{color:#66705d;line-height:1.45}
button{background:#759a58;color:white;border:0;border-radius:16px;padding:14px 25px;font-size:17px;font-weight:800}
#joy{position:fixed;left:22px;bottom:max(22px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:#ffffff45;border:2px solid #fff8;z-index:6}
#stick{position:absolute;width:58px;height:58px;border-radius:50%;background:#ffffffb8;left:37px;top:37px}
#sniff{position:fixed;right:20px;bottom:max(28px,env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;border:0;background:#fff;color:#5d7d48;font-size:28px;box-shadow:0 4px 15px #0002;z-index:6}
.hidden{display:none!important}
</style>
</head>

<div id="joy"><div id="stick"></div></div>

<div id="start"><div class="card">
<h1>🐈 Treat Hunt</h1>
<p>Explore the garden and find all the hidden treats.</p>
<p>Their hiding places change every hunt. Tap the nose when you think you're close!</p>
<button id="startBtn">Start hunting</button>
</div></div>

<h1 id="finishTitle"></h1><p id="finishText"></p>
<button id="again">Hunt again</button>
</div></div>

let dpr=1,W=0,H=0,running=false,last=0,time=90,found=0;
const world={w:2600,h:1800};
const p={x:1300,y:900,vx:0,vy:0};
let treats=[], joy={x:0,y:0}, sniff=0;

function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;X.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

function makeTreats(){
 treats=[];
 for(let i=0;i<12;i++){
   let x,y;
   do{x=120+Math.random()*2360;y=170+Math.random()*1500}
   while(Math.hypot(x-p.x,y-p.y)<250||treats.some(t=>Math.hypot(t.x-x,t.y-y)<170));
   treats.push({x,y,found:false,phase:Math.random()*6.28});
 }
}
function start(){
 document.getElementById('start').classList.add('hidden');
 document.getElementById('finish').classList.add('hidden');
 found=0;time=90;p.x=1300;p.y=900;joy.x=joy.y=0;makeTreats();updateHud();
 running=true;last=performance.now();requestAnimationFrame(loop);
}
function updateHud(){score.textContent=found;timer.textContent=Math.ceil(time)}
function worldDraw(){
 X.fillStyle='#b8d69b';X.fillRect(0,0,world.w,world.h);
 // grass patches
 for(let i=0;i<90;i++){let x=(i*317)%world.w,y=(i*173)%world.h;X.fillStyle='#a9cc8b';X.beginPath();X.arc(x,y,25+(i%4)*8,0,7);X.fill()}
 // path
 X.fillStyle='#d7c493';X.beginPath();X.moveTo(0,1050);X.bezierCurveTo(500,800,850,1150,1300,980);X.bezierCurveTo(1750,800,2100,1050,2600,850);X.lineTo(2600,1100);X.bezierCurveTo(2100,1250,1750,1000,1300,1150);X.bezierCurveTo(850,1300,450,950,0,1200);X.closePath();X.fill();
 // pond
 X.fillStyle='#91c7d2';X.beginPath();X.ellipse(430,430,210,120,-.1,0,7);X.fill();
 // trees
 for(let i=0;i<18;i++){let x=120+(i*389)%2350,y=180+(i*271)%1400;X.fillStyle='#795d3c';X.fillRect(x-9,y,18,60);X.fillStyle='#6f9652';X.beginPath();X.arc(x,y,55,0,7);X.fill();X.beginPath();X.arc(x-35,y+15,35,0,7);X.fill();X.beginPath();X.arc(x+35,y+15,35,0,7);X.fill()}
 // little houses/boxes
 X.fillStyle='#c58d57';X.fillRect(2050,300,210,150);X.fillStyle='#9a633d';X.beginPath();X.moveTo(2020,300);X.lineTo(2155,205);X.lineTo(2290,300);X.closePath();X.fill();
 X.fillStyle='#6b4a2d';X.fillRect(2125,365,55,85);
 // fence
 X.strokeStyle='#e9d7ae';X.lineWidth=12;X.beginPath();X.moveTo(0,95);X.lineTo(world.w,95);X.stroke();
 for(let x=20;x<world.w;x+=65){X.fillRect(x,60,10,70)}
}
function drawTreat(t){
 if(t.found)return;
 const glow=10+Math.sin(performance.now()/220+t.phase)*4;
 X.save();X.translate(t.x,t.y);
 X.fillStyle='#0002';X.beginPath();X.ellipse(0,18,25,8,0,0,7);X.fill();
 X.strokeStyle='#fff9';X.lineWidth=4;X.beginPath();X.arc(0,0,glow,0,7);X.stroke();
 X.fillStyle='#f1a34a';X.beginPath();X.roundRect(-22,-15,44,30,10);X.fill();
 X.fillStyle='#fff2bd';X.beginPath();X.arc(-8,-3,5,0,7);X.arc(8,3,5,0,7);X.fill();
 X.restore();
}
function drawCat(){
 X.save();X.translate(p.x,p.y);
 X.fillStyle='#0003';X.beginPath();X.ellipse(0,39,45,12,0,0,7);X.fill();
 if(cat.complete){let s=Math.min(115/cat.width,115/cat.height);X.drawImage(cat,-cat.width*s/2,-cat.height*s/2,cat.width*s,cat.height*s)}
 else {X.fillStyle='#111';X.beginPath();X.arc(0,0,42,0,7);X.fill()}
 X.restore();
}
function update(dt){
 let dx=joy.x,dy=joy.y;
 if(!dx&&!dy){
  dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);
  dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);
 }
 let l=Math.hypot(dx,dy);if(l){dx/=l;dy/=l;p.vx=dx*250;p.vy=dy*250}else{p.vx*=.82;p.vy*=.82}
 p.x=Math.max(55,Math.min(world.w-55,p.x+p.vx*dt));p.y=Math.max(145,Math.min(world.h-55,p.y+p.vy*dt));
 for(const t of treats)if(!t.found&&Math.hypot(p.x-t.x,p.y-t.y)<75){t.found=true;found++;updateHud()}
 time-=dt;updateHud();
 if(found===12){finish(true);return}if(time<=0){finish(false);return}
}
function draw(){
 X.clearRect(0,0,W,H);
 const camX=Math.max(0,Math.min(world.w-W,p.x-W/2)),camY=Math.max(0,Math.min(world.h-H,p.y-H/2));
 X.save();X.translate(-camX,-camY);worldDraw();treats.forEach(drawTreat);drawCat();
 if(sniff>0){X.globalAlpha=sniff;X.fillStyle='#fff';X.font='bold 28px sans-serif';X.fillText('✨',p.x+35,p.y-45);X.fillText('✨',p.x+5,p.y-65);X.globalAlpha=1}
 X.restore();
}
function loop(now){if(!running)return;let dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);draw();if(running)requestAnimationFrame(loop)}
function finish(win){
 running=false;document.getElementById('finish').classList.remove('hidden');
 finishTitle.textContent=win?'🎉 All treats found!':'🐾 Time is up!';
 finishText.textContent=win?'You found all 12 treats!':'You found '+found+' of 12 treats.';
}
const keys={};addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);
startBtn.addEventListener('click',start);again.addEventListener('click',start);
sniff.addEventListener('click',()=>{sniff=1;let nearest=Infinity;for(const t of treats)if(!t.found)nearest=Math.min(nearest,Math.hypot(p.x-t.x,p.y-t.y));setTimeout(()=>sniff=0,350)});
const pad=document.getElementById('joy'),stick=document.getElementById('stick');
function jt(e){e.preventDefault();let r=pad.getBoundingClientRect(),q=e.touches[0],x=q.clientX-(r.left+r.width/2),y=q.clientY-(r.top+r.height/2),m=Math.hypot(x,y)||1,lim=43,z=Math.min(m,lim);joy.x=x/m*z/lim;joy.y=y/m*z/lim;stick.style.transform='translate('+(x/m*z)+'px,'+(y/m*z)+'px)'}
pad.addEventListener('touchstart',jt,{passive:false});pad.addEventListener('touchmove',jt,{passive:false});pad.addEventListener('touchend',()=>{joy.x=joy.y=0;stick.style.transform=''});

draw();
</script>
